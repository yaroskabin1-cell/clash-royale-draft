name: Render Scheduled Server Toggle

on:
  schedule:
    # Europe/Berlin is UTC+2 on 2026-07-29.
    - cron: "0 9 29 7 *"
    - cron: "0 14 29 7 *"
  workflow_dispatch:
    inputs:
      action:
        description: "Render action to run"
        required: true
        default: "resume"
        type: choice
        options:
          - resume
          - suspend

jobs:
  toggle-render-service:
    runs-on: ubuntu-latest
    steps:
      - name: Decide action
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(date -u +%F)" != "2026-07-29" ]; then
            echo "Skipping because this one-time schedule is only for 2026-07-29."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$(date -u +%H)" in
            09) echo "action=resume" >> "$GITHUB_OUTPUT" ;;
            14) echo "action=suspend" >> "$GITHUB_OUTPUT" ;;
            *) echo "action=skip" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Toggle Render service
        if: steps.decide.outputs.action != 'skip'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d9khsvijnfac7396l5r0
          RENDER_ACTION: ${{ steps.decide.outputs.action }}
        run: |
          test -n "$RENDER_API_KEY"
          curl --fail --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/${RENDER_ACTION}" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}"
