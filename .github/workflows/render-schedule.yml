name: Render Scheduled Server Toggle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-schedule.yml"
  schedule:
    # GitHub cron is UTC. Run around both DST offsets and let the step below
    # decide by the real Europe/Berlin hour.
    - cron: "7 9,10,14,15 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Render action to run"
        required: true
        default: "resume"
        type: choice
        options:
          - resume
          - suspend

jobs:
  toggle-render-service:
    runs-on: ubuntu-latest
    steps:
      - name: Decide action
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "action=resume" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$(TZ=Europe/Berlin date +%H)" in
            11) echo "action=resume" >> "$GITHUB_OUTPUT" ;;
            16) echo "action=suspend" >> "$GITHUB_OUTPUT" ;;
            *) echo "action=skip" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Toggle Render service
        if: steps.decide.outputs.action != 'skip'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d9khsvijnfac7396l5r0
          RENDER_ACTION: ${{ steps.decide.outputs.action }}
        run: |
          test -n "$RENDER_API_KEY"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/${RENDER_ACTION}" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}")"

          cat "$response_file"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            exit 0
          fi

          if grep -Eiq "already|active|suspended|not running" "$response_file"; then
            echo "Render service was already in the requested state."
            exit 0
          fi

          echo "Render API returned HTTP ${http_code}."
          exit 1

      - name: Wait for health after resume
        if: steps.decide.outputs.action == 'resume'
        run: |
          for attempt in $(seq 1 36); do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" https://clash-royale-draft.onrender.com/healthz || true)"
            if [ "$status" = "200" ]; then
              echo "Server is online."
              exit 0
            fi
            echo "Waiting for server, attempt ${attempt}/36 (HTTP ${status})"
            sleep 10
          done

          echo "Render resume command was sent, but health check did not become ready in time."
          exit 1
